[alias]
vdev = "run --quiet --package vdev --"

[env]
# Build jemalloc assuming 64K pages so binaries also run on aarch64 hosts whose
# kernels ship with a 64K page size (notably EL8 aarch64). On 4K-page hosts this
# coarsens jemalloc's allocation granularity; no regression was measured in
# https://github.com/vectordotdev/vector/pull/18481.
JEMALLOC_SYS_WITH_LG_PAGE = "16"

[target.'cfg(all())']
rustflags = [
  "-D", "warnings",
  "-Dclippy::print_stdout",
  "-Dclippy::print_stderr",
  "-Dclippy::dbg_macro",
]

# NOTE (pleme-io cve-strip fork): upstream carried three musl targets here --
# x86_64-unknown-linux-musl, aarch64-unknown-linux-musl and
# armv7-unknown-linux-musleabihf -- each setting a STRING-form
# `rustflags = "-Lnative=/lib/native-libs"` to pick up the `libstdc++` that
# `scripts/cross/Dockerfile` copies into that directory for C++ deps (librdkafka
# et al) inside the `cross` base image.
#
# They are removed for two independent reasons:
#   1. `/lib/native-libs` is a `cross`-Docker artifact. It does not exist under
#      nix; the nix toolchain owns musl rustflags and supplies the sysroot and
#      any native lib paths itself.
#   2. String form is unmergeable. nixpkgs' pkgsStatic injects an ARRAY-form
#      `rustflags` for these same target keys, and cargo refuses to merge a
#      string with an array -- `failed to merge key 'rustflags': expected
#      string, but found array` -- which killed the static-musl build at
#      cargoBuildHook config load, before compiling anything. The glibc targets
#      below were never affected because they already use the array form.
#
# The C++ dependency that motivated the flag is also gone at cause: this fork
# drops kafka (sinks+sources), so `dep:rdkafka`/librdkafka is never compiled.
# Do not re-add these as arrays -- the flags themselves are wrong for nix.

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-args=-rdynamic"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-args=-rdynamic"]

[target.x86_64-pc-windows-msvc]
# https://github.com/dtolnay/inventory/issues/58
rustflags = ["-C", "codegen-units=1", "-Ctarget-feature=+crt-static"]
